server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA routing — fall back to index.html for any path not found
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html so Angular app updates propagate
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache hashed static assets aggressively (Angular build appends content hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint for ALB
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
